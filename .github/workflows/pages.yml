name: Deploy Alex HQ to GitHub Pages

on:
  push:
    branches: [claude/alex-hq-web-app-ndzk1l]
    paths-ignore:
      - 'zetaris-prospector/**'
  workflow_dispatch:

# NOTE: the `github-pages` environment only accepts deployments from the
# repository's default branch unless you add a deployment branch rule.
# This app lives on a feature branch, so before the first successful run:
#   Settings -> Environments -> github-pages -> Deployment branches and tags
#   -> Add rule -> claude/*
# Without that, the job is rejected in ~3s with "not allowed to deploy to
# github-pages due to environment protection rules" and never builds.

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app is plain static files — no build step, nothing to install.
      # Ship only what the site needs.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
