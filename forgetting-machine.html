<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>The Forgetting Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { height: 100%; }

        body {
            height: 100%;
            background: #0f0f0f;
            color: #e8e3dc;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Grain texture */
        #grain {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.045;
        }

        /* ======================================
           DUMP SCREEN
        ====================================== */
        #s-dump {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12vh 6vw 9vh;
            background: #0f0f0f;
        }

        #the-area {
            flex: 1;
            width: 100%;
            max-width: 600px;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: #e8e3dc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: clamp(17px, 4.3vw, 20px);
            font-weight: 300;
            line-height: 1.82;
            letter-spacing: 0.01em;
            caret-color: #c8a882;
            transition: opacity 1.4s ease, filter 1.4s ease;
        }

        #the-area::placeholder {
            color: rgba(232, 227, 220, 0.19);
        }

        #hand-over {
            flex-shrink: 0;
            margin-top: 36px;
            padding: 13px 38px;
            background: transparent;
            border: 1px solid rgba(232, 227, 220, 0.09);
            color: rgba(232, 227, 220, 0.28);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.17em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 1px;
            -webkit-appearance: none;
            transition: color 0.35s, border-color 0.35s, opacity 1.2s ease;
        }

        #hand-over:hover {
            color: rgba(232, 227, 220, 0.55);
            border-color: rgba(232, 227, 220, 0.18);
        }

        /* ======================================
           PROCESSING SCREEN
        ====================================== */
        #s-proc {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
        }

        #s-proc.on { display: flex; }

        .orb {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c8a882;
            animation: breathe 2.8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.28; transform: scale(1); }
            50%       { opacity: 0.72; transform: scale(2.2); }
        }

        /* ======================================
           RESPONSE SCREEN
        ====================================== */
        #s-resp {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #100e0c;
            padding: 78px 6vw 90px;
        }

        #s-resp.on { display: flex; }

        .r-inner {
            width: 100%;
            max-width: 540px;
        }

        /* Heard list */
        .heard-list {
            font-family: 'Lora', Georgia, serif;
            font-size: clamp(15px, 3.9vw, 18px);
            font-weight: 400;
            line-height: 2.1;
            color: rgba(232, 227, 220, 0.48);
        }

        .heard-item { display: block; }

        /* Divider */
        .divider {
            width: 32px;
            height: 1px;
            background: rgba(200, 168, 130, 0.17);
            margin: 54px 0;
        }

        /* Closing statement */
        .closing-wrap {
            background: #1c1510;
            border-radius: 3px;
            padding: 50px 28px 54px;
            text-align: center;
        }

        .closing-p {
            font-family: 'Lora', Georgia, serif;
            font-size: clamp(19px, 4.9vw, 24px);
            font-weight: 400;
            font-style: italic;
            line-height: 1.78;
            color: #c8a882;
            letter-spacing: 0.01em;
        }

        /* Let go button */
        .let-go {
            display: block;
            margin: 62px auto 0;
            padding: 14px 46px;
            background: transparent;
            border: 1px solid rgba(200, 168, 130, 0.15);
            color: rgba(200, 168, 130, 0.34);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.17em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 1px;
            -webkit-appearance: none;
            transition: color 0.4s, border-color 0.4s;
        }

        .let-go:hover {
            color: rgba(200, 168, 130, 0.72);
            border-color: rgba(200, 168, 130, 0.3);
        }

        /* Error state */
        .err-text {
            font-family: 'Lora', Georgia, serif;
            font-size: 17px;
            font-style: italic;
            line-height: 1.72;
            color: rgba(232, 227, 220, 0.38);
            text-align: center;
            padding: 16px 0;
        }

        /* ======================================
           GONE OVERLAY
        ====================================== */
        #s-gone {
            position: fixed;
            inset: 0;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.32s ease;
        }

        #s-gone.in { opacity: 1; }

        #gone-word {
            font-family: 'Lora', Georgia, serif;
            font-size: 18px;
            font-style: italic;
            color: rgba(232, 227, 220, 0.3);
            letter-spacing: 0.07em;
            opacity: 0;
            transition: opacity 0.55s ease;
        }

        #gone-word.in { opacity: 1; }
    </style>
</head>
<body>

<!-- Grain texture -->
<svg id="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="gf">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#gf)"/>
</svg>

<!-- Dump Screen -->
<div id="s-dump">
    <textarea id="the-area"
        placeholder="What's taking up space in your head right now?"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="sentences"
        spellcheck="false"></textarea>
    <button id="hand-over">Hand it over</button>
</div>

<!-- Processing Screen -->
<div id="s-proc">
    <div class="orb"></div>
</div>

<!-- Response Screen -->
<div id="s-resp">
    <div class="r-inner" id="r-inner"></div>
</div>

<!-- Gone Overlay -->
<div id="s-gone">
    <span id="gone-word">Gone.</span>
</div>

<script>
const SYS = `You are a quiet presence that receives what someone hands over.

When someone shares what weighs on them, do this:

Name each distinct thought, worry, feeling, or task — no more than 8, even if more were written. Choose the heaviest ones. Write each as a plain single line. No bullets, no numbers, no dashes, no symbols. Each line should name what you heard, specific to their words — not generic. Write gently, in a way that shows you actually read what they wrote: "The worry about the meeting." "The guilt from Tuesday you can't put down." "The money thing that comes back at 2am." Be precise to them, not to a type.

After the list, write this on its own line and nothing else:
---

Then write a closing statement: 2 to 4 sentences. It must feel like it was shaped by exactly what they shared — not a template, not a formula. Tell them these things are held now. Give them permission to set them down, just for tonight. End with something that sounds like a door gently closing. Never use the word "mindfulness." No advice. No action steps. No reframing. No suggestions. Only rest.

Your entire response must follow this format exactly, and nothing else:
[thought]
[thought]
[thought]
---
[closing statement]

No preamble. No greeting. No sign-off. Nothing before the first thought. Nothing after the closing statement.`;

const API  = 'https://api.anthropic.com/v1/messages';
const MOD  = 'claude-sonnet-4-6';
const LKEY = 'fm_api_key';

let apiKey = localStorage.getItem(LKEY) || '';
let busy   = false;

const sDump  = document.getElementById('s-dump');
const sProc  = document.getElementById('s-proc');
const sResp  = document.getElementById('s-resp');
const rInner = document.getElementById('r-inner');
const sGone  = document.getElementById('s-gone');
const gWord  = document.getElementById('gone-word');
const ta     = document.getElementById('the-area');
const btn    = document.getElementById('hand-over');

const wait = ms => new Promise(r => setTimeout(r, ms));

// ---- API key ----

function getKey() {
    if (apiKey) return apiKey;
    const k = (prompt('Enter your Anthropic API key.\n\nIt is saved locally on this device and used only to reach Claude — nothing else.') || '').trim();
    if (k) { apiKey = k; localStorage.setItem(LKEY, k); }
    return apiKey;
}

// ---- Claude call ----

async function ask(txt) {
    const k = getKey();
    if (!k) throw { code: 'no_key' };

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 45000);

    let res;
    try {
        res = await fetch(API, {
            signal: ctrl.signal,
            method: 'POST',
            headers: {
                'content-type': 'application/json',
                'x-api-key': k,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
                model: MOD,
                max_tokens: 600,
                system: SYS,
                messages: [{ role: 'user', content: txt }]
            })
        });
    } finally {
        clearTimeout(timer);
    }

    if (res.status === 401) {
        localStorage.removeItem(LKEY);
        apiKey = '';
        throw { code: 'bad_key' };
    }

    if (!res.ok) throw { code: 'api', status: res.status };

    const data = await res.json();
    return data.content[0].text;
}

// ---- Parse response ----

function parse(raw) {
    const m = raw.match(/\n---+\s*\n?/);
    if (!m) return { items: [], closing: raw.trim() };

    const items = raw.slice(0, m.index).trim()
        .split('\n')
        .map(l => l.replace(/^[\d.)\-–—•*]\s*/, '').trim())
        .filter(Boolean);

    const closing = raw.slice(m.index + m[0].length).trim();
    return { items, closing };
}

// ---- Escape HTML ----

function esc(s) {
    return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
}

// ---- Render response ----

function render(raw) {
    const { items, closing } = parse(raw);
    let html = '';

    if (items.length) {
        html += '<div class="heard-list">' +
            items.map(t => `<span class="heard-item">${esc(t)}</span>`).join('') +
            '</div><div class="divider"></div>';
    }

    html += `<div class="closing-wrap"><p class="closing-p">${esc(closing)}</p></div>`;
    html += '<button class="let-go" id="let-go-btn">Let go</button>';

    rInner.innerHTML = html;
    document.getElementById('let-go-btn').addEventListener('click', release);
}

// ---- Submit flow ----

async function submit() {
    if (busy) return;
    const txt = ta.value.trim();
    if (!txt) return;
    busy = true;

    // Dissolve the text
    ta.style.opacity = '0';
    ta.style.filter = 'blur(9px)';
    btn.style.opacity = '0';

    await wait(1300);

    sDump.style.display = 'none';
    sProc.classList.add('on');

    let raw;
    try {
        raw = await ask(txt);
    } catch (e) {
        const msg = e.code === 'bad_key'
            ? "That key didn’t work. Your thoughts are still heard."
            : "Something went wrong. Your thoughts are still heard.";

        rInner.innerHTML = `<p class="err-text">${esc(msg)}</p>
            <button class="let-go" id="let-go-btn" style="margin-top:32px">Return</button>`;

        sProc.classList.remove('on');
        sResp.classList.add('on');

        document.getElementById('let-go-btn').addEventListener('click', () => {
            sResp.classList.remove('on');
            resetDump();
        });

        busy = false;
        return;
    }

    render(raw);

    await wait(480);

    sProc.classList.remove('on');
    sResp.classList.add('on');
    sResp.scrollTop = 0;
    busy = false;
}

// ---- Release ritual ----

function release() {
    if (busy) return;
    busy = true;

    // Fade response out over 2s
    sResp.style.transition = 'opacity 2s ease';
    sResp.style.opacity = '0';

    setTimeout(() => {
        sResp.classList.remove('on');
        sResp.style.opacity = '';
        sResp.style.transition = '';

        // Show "Gone." overlay
        sGone.classList.add('in');
        setTimeout(() => gWord.classList.add('in'), 90);

        // Hold, then fade word
        setTimeout(() => {
            gWord.classList.remove('in');

            setTimeout(() => {
                sGone.classList.remove('in');

                setTimeout(() => {
                    resetDump();
                    busy = false;
                }, 380);
            }, 620);
        }, 1350);

    }, 2000);
}

// ---- Reset dump screen ----

function resetDump() {
    ta.value = '';
    ta.style.opacity  = '';
    ta.style.filter   = '';
    btn.style.opacity = '';
    sDump.style.display = '';
    setTimeout(() => ta.focus(), 90);
}

// ---- Events ----

btn.addEventListener('click', submit);

ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        submit();
    }
});

window.addEventListener('load', () => ta.focus());
</script>
</body>
</html>
