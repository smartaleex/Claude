services:
  - type: web
    name: zetaris-prospector
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/zetaris_prospects.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
