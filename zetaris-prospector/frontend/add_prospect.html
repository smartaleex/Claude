<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Prospect — Zetaris Prospector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="addProspect()">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/" class="text-gray-400 hover:text-gray-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <h1 class="font-bold text-gray-900">Add Prospect</h1>
    </div>
  </header>

  <div class="max-w-2xl mx-auto px-4 py-8">

    <!-- Tab navigation -->
    <div class="flex gap-1 bg-gray-100 rounded-lg p-1 mb-6">
      <button @click="tab='single'" :class="tab==='single' ? 'bg-white shadow text-gray-900' : 'text-gray-500'"
        class="flex-1 text-sm py-2 rounded-md transition">Single Prospect</button>
      <button @click="tab='csv'" :class="tab==='csv' ? 'bg-white shadow text-gray-900' : 'text-gray-500'"
        class="flex-1 text-sm py-2 rounded-md transition">Import CSV</button>
    </div>

    <!-- Single Prospect Form -->
    <div x-show="tab === 'single'" class="bg-white rounded-xl border border-gray-200 p-6">
      <form @submit.prevent="submitSingle()">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Company Name *</label>
            <input type="text" required x-model="form.company_name" placeholder="Telstra Corporation"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Domain *</label>
            <input type="text" required x-model="form.domain" placeholder="telstra.com"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <p class="text-xs text-gray-400 mt-1">Enter the main domain (e.g. telstra.com, not www.telstra.com)</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Org (optional)</label>
            <input type="text" x-model="form.github_org" placeholder="telstra"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">LinkedIn URL (optional)</label>
            <input type="url" x-model="form.linkedin_url" placeholder="https://linkedin.com/company/telstra"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tags (optional)</label>
            <input type="text" x-model="tagsInput" placeholder="telecom, australia, tier1"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <p class="text-xs text-gray-400 mt-1">Comma-separated tags</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
            <textarea x-model="form.notes" rows="3" placeholder="Any context about this prospect..."
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button type="submit" :disabled="submitting"
            class="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition disabled:opacity-50 text-sm font-medium">
            <span x-show="!submitting">Add & Start Enrichment</span>
            <span x-show="submitting">Adding...</span>
          </button>
          <a href="/" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50">Cancel</a>
        </div>

        <div x-show="error" class="mt-3 text-red-600 text-sm" x-text="error"></div>
      </form>
    </div>

    <!-- CSV Import -->
    <div x-show="tab === 'csv'" class="bg-white rounded-xl border border-gray-200 p-6">
      <div class="mb-4">
        <p class="text-sm text-gray-600 mb-2">Upload a CSV file with these columns:</p>
        <code class="text-xs bg-gray-100 px-2 py-1 rounded">company_name, domain, github_org (optional), tags (optional)</code>
      </div>

      <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center" @drop.prevent="handleDrop($event)" @dragover.prevent>
        <input type="file" accept=".csv" @change="handleFile($event)" class="hidden" id="csvFile" />
        <label for="csvFile" class="cursor-pointer">
          <div class="text-3xl mb-2">📄</div>
          <p class="text-sm text-gray-600"><span class="text-indigo-600 font-medium">Click to upload</span> or drag & drop</p>
          <p class="text-xs text-gray-400 mt-1">CSV files only</p>
        </label>
        <div x-show="csvFile" class="mt-3 text-sm text-gray-700" x-text="csvFile?.name"></div>
      </div>

      <button @click="submitCSV()" :disabled="!csvFile || submitting" x-show="csvFile"
        class="mt-4 w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition disabled:opacity-50 text-sm font-medium">
        <span x-show="!submitting">Import CSV</span>
        <span x-show="submitting">Importing...</span>
      </button>

      <div x-show="importResult" class="mt-4 text-sm">
        <p class="text-green-700 font-medium" x-text="`Imported: ${importResult?.imported} new prospects`"></p>
        <p class="text-gray-500" x-text="`Skipped (duplicates): ${importResult?.skipped_duplicates}`"></p>
        <p x-show="importResult?.errors?.length" class="text-red-600" x-text="`Errors: ${importResult?.errors?.length}`"></p>
        <a href="/" class="text-indigo-600 hover:underline text-sm mt-2 block">View all prospects</a>
      </div>
    </div>

    <!-- Quick-add examples -->
    <div class="mt-6 p-4 bg-indigo-50 rounded-xl border border-indigo-100">
      <h3 class="text-sm font-semibold text-indigo-900 mb-2">Quick-add Zetaris sweet-spot examples</h3>
      <div class="flex flex-wrap gap-2">
        <template x-for="[name, domain] in quickExamples">
          <button @click="quickAdd(name, domain)" class="text-xs bg-white border border-indigo-200 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-100 transition">
            + <span x-text="name"></span>
          </button>
        </template>
      </div>
    </div>
  </div>

  <script>
    function addProspect() {
      return {
        tab: 'single',
        form: { company_name: '', domain: '', github_org: '', linkedin_url: '', notes: '' },
        tagsInput: '',
        submitting: false,
        error: '',
        csvFile: null,
        importResult: null,
        quickExamples: [
          ['Telstra', 'telstra.com'],
          ['NBN Co', 'nbnco.com.au'],
          ['BUPA', 'bupa.com'],
          ['CommBank', 'commbank.com.au'],
          ['Woolworths', 'woolworthsgroup.com.au'],
          ['Medibank', 'medibank.com.au'],
        ],

        async submitSingle() {
          this.error = '';
          this.submitting = true;
          const payload = {
            ...this.form,
            tags: this.tagsInput ? this.tagsInput.split(',').map(t => t.trim()).filter(Boolean) : [],
          };
          try {
            const r = await fetch('/api/prospects', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (r.ok) {
              const data = await r.json();
              window.location = `/prospect/${data.id}`;
            } else {
              const err = await r.json();
              this.error = err.detail || 'Failed to add prospect';
            }
          } catch(e) {
            this.error = e.message;
          } finally {
            this.submitting = false;
          }
        },

        handleFile(e) { this.csvFile = e.target.files[0]; },
        handleDrop(e) { this.csvFile = e.dataTransfer.files[0]; },

        async submitCSV() {
          this.submitting = true;
          const fd = new FormData();
          fd.append('file', this.csvFile);
          const r = await fetch('/api/prospects/import/csv', { method: 'POST', body: fd });
          this.importResult = await r.json();
          this.submitting = false;
        },

        quickAdd(name, domain) {
          this.form.company_name = name;
          this.form.domain = domain;
          this.tab = 'single';
        },
      };
    }
  </script>
</body>
</html>
