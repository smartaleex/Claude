<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prospect Detail — Zetaris Prospector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .tier-hot { background:#fef2f2;color:#dc2626;border:1px solid #fecaca; }
    .tier-warm { background:#fffbeb;color:#d97706;border:1px solid #fde68a; }
    .tier-cold { background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe; }
    .tier-disqualified { background:#f9fafb;color:#6b7280;border:1px solid #e5e7eb; }
    .tier-unscored { background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe; }
    .prose { max-width:100%; }
    .prose h2 { font-size:1.1rem; font-weight:700; margin:1.25rem 0 0.5rem; color:#1f2937; }
    .prose p, .prose li { font-size:0.875rem; color:#374151; margin-bottom:0.5rem; line-height:1.6; }
    .prose ul { list-style:disc; padding-left:1.25rem; }
    .prose strong { font-weight:600; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="prospectDetail()" x-init="init()">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/" class="text-gray-400 hover:text-gray-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <div class="flex-1">
        <h1 class="font-bold text-gray-900 text-lg" x-text="prospect?.company_name || 'Loading...'"></h1>
        <p class="text-xs text-gray-500" x-text="prospect?.domain"></p>
      </div>
      <div class="flex items-center gap-2" x-show="prospect">
        <span class="text-xs font-semibold px-2 py-1 rounded-full"
          :class="`tier-${(prospect?.icp_tier||'unscored').toLowerCase()}`"
          x-text="prospect?.icp_tier || 'Unscored'"></span>
        <span class="font-mono font-bold text-2xl text-gray-900" x-text="prospect?.icp_score?.toFixed(0)"></span>
        <span class="text-xs text-gray-400">/ 100</span>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Left Column: Company Info + Signals -->
    <div class="lg:col-span-1 space-y-4">

      <!-- Company Card -->
      <div class="bg-white rounded-xl border border-gray-200 p-4" x-show="prospect">
        <h2 class="font-semibold text-sm text-gray-700 mb-3">Company Profile</h2>
        <dl class="space-y-2 text-sm">
          <div class="flex justify-between"><dt class="text-gray-500">Industry</dt><dd class="font-medium text-right" x-text="prospect?.industry || '—'"></dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">Employees</dt><dd class="font-medium" x-text="prospect?.employee_count ? prospect.employee_count.toLocaleString() : '—'"></dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">Country</dt><dd class="font-medium" x-text="prospect?.hq_country || '—'"></dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">GitHub Org</dt>
            <dd>
              <a x-show="prospect?.github_org" :href="`https://github.com/${prospect?.github_org}`" target="_blank"
                class="text-indigo-600 hover:underline font-medium" x-text="prospect?.github_org"></a>
              <span x-show="!prospect?.github_org" class="text-gray-400">—</span>
            </dd>
          </div>
          <div class="flex justify-between"><dt class="text-gray-500">Enrich Status</dt>
            <dd class="font-medium" x-text="prospect?.enrichment_status"></dd></div>
        </dl>
        <div class="mt-3 pt-3 border-t border-gray-100 flex gap-2">
          <button @click="enrich()" class="flex-1 text-xs bg-gray-100 hover:bg-indigo-50 hover:text-indigo-700 text-gray-700 px-3 py-2 rounded-lg transition">
            Re-enrich
          </button>
          <button @click="synthesize()" class="flex-1 text-xs bg-gray-100 hover:bg-green-50 hover:text-green-700 text-gray-700 px-3 py-2 rounded-lg transition">
            Re-synthesize
          </button>
        </div>
      </div>

      <!-- Score Breakdown -->
      <div class="bg-white rounded-xl border border-gray-200 p-4" x-show="signals.length > 0" x-cloak>
        <h2 class="font-semibold text-sm text-gray-700 mb-3">Signal Breakdown</h2>
        <div class="space-y-2">
          <template x-for="s in signals.sort((a,b) => b.signal_points - a.signal_points)" :key="s.id">
            <div class="text-xs rounded-lg p-2" :class="s.is_anti_signal ? 'bg-red-50' : s.signal_tier === 1 ? 'bg-amber-50' : s.signal_tier === 2 ? 'bg-blue-50' : 'bg-gray-50'">
              <div class="flex justify-between items-start">
                <span class="font-medium text-gray-800" x-text="s.signal_name.replace(/_/g,' ')"></span>
                <span class="font-mono font-bold ml-2" :class="s.signal_points > 0 ? 'text-green-700' : 'text-red-600'" x-text="(s.signal_points > 0 ? '+' : '') + s.signal_points"></span>
              </div>
              <p class="text-gray-500 mt-0.5 line-clamp-2" x-text="s.evidence_text"></p>
              <div class="flex justify-between mt-1">
                <span class="text-gray-400" x-text="s.source"></span>
                <a x-show="s.evidence_url" :href="s.evidence_url" target="_blank" class="text-indigo-500 hover:underline">source</a>
                <button @click="deleteSignal(s.id)" class="text-red-400 hover:text-red-600 text-xs">remove</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Right Column: Intelligence Profile + Outreach -->
    <div class="lg:col-span-2 space-y-4">

      <!-- Intelligence Profile -->
      <div class="bg-white rounded-xl border border-gray-200 p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-gray-900">Intelligence Profile</h2>
          <button @click="synthesize()" class="text-xs text-indigo-600 hover:underline" x-show="prospect?.intelligence_profile">Regenerate</button>
        </div>

        <div x-show="!prospect?.intelligence_profile" class="text-center py-10 text-gray-400">
          <p class="text-sm mb-3">No profile generated yet.</p>
          <button @click="synthesize()" class="bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-indigo-700">
            Generate with Claude AI
          </button>
        </div>

        <div x-show="prospect?.intelligence_profile" x-cloak>
          <div class="prose" x-html="renderMarkdown(prospect?.intelligence_profile)"></div>
          <p class="text-xs text-gray-400 mt-3" x-text="prospect?.profile_generated_at ? `Generated: ${new Date(prospect.profile_generated_at).toLocaleString()}` : ''"></p>
        </div>
      </div>

      <!-- Outreach Generator -->
      <div class="bg-white rounded-xl border border-gray-200 p-5">
        <h2 class="font-semibold text-gray-900 mb-4">Generate Outreach</h2>

        <div class="grid grid-cols-3 gap-3 mb-4">
          <div>
            <label class="block text-xs text-gray-600 mb-1">Channel</label>
            <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" x-model="outreachForm.channel">
              <option value="cold-email">Cold Email</option>
              <option value="linkedin">LinkedIn</option>
              <option value="followup">Follow-up</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Target Persona</label>
            <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" x-model="outreachForm.target_persona">
              <option value="cdo">CDO</option>
              <option value="vp-data">VP Data</option>
              <option value="vp-engineering">VP Engineering</option>
              <option value="cto">CTO</option>
              <option value="data-architect">Data Architect</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Sender</label>
            <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" x-model="outreachForm.sender_persona">
              <option value="ae">Account Executive</option>
              <option value="sdr">SDR</option>
            </select>
          </div>
        </div>

        <button @click="generateOutreach()" :disabled="generatingOutreach"
          class="bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition">
          <span x-show="!generatingOutreach">Generate 3 Variants</span>
          <span x-show="generatingOutreach">Generating...</span>
        </button>

        <!-- Outreach Variants -->
        <div x-show="latestOutreach" x-cloak class="mt-5 space-y-4">
          <template x-for="[key, label, color] in [['variant_a','Variant A — Problem-led','indigo'],['variant_b','Variant B — Trigger-led','violet'],['variant_c','Variant C — Outcome-led','emerald']]">
            <div class="rounded-lg border p-4" :class="`border-${color}-200 bg-${color}-50`" x-show="latestOutreach?.[key]">
              <div class="flex justify-between items-center mb-2">
                <span class="font-semibold text-sm" :class="`text-${color}-900`" x-text="label"></span>
                <button @click="copyToClipboard(latestOutreach?.[key])"
                  class="text-xs text-gray-500 hover:text-gray-700 border border-gray-300 px-2 py-1 rounded">Copy</button>
              </div>
              <pre class="text-xs text-gray-700 whitespace-pre-wrap font-sans leading-relaxed" x-text="latestOutreach?.[key]"></pre>
            </div>
          </template>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div x-show="toast" x-cloak x-transition
    class="fixed bottom-6 right-6 bg-gray-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg"
    x-text="toast"></div>

  <script>
    function prospectDetail() {
      const prospectId = parseInt(window.location.pathname.split('/').pop());
      return {
        prospect: null,
        signals: [],
        latestOutreach: null,
        generatingOutreach: false,
        toast: '',
        outreachForm: { channel: 'cold-email', target_persona: 'cdo', sender_persona: 'ae' },

        async init() {
          await this.loadProspect();
          // Poll if enrichment in progress
          if (this.prospect?.enrichment_status === 'in_progress') {
            const poll = setInterval(async () => {
              await this.loadProspect();
              if (this.prospect?.enrichment_status !== 'in_progress') clearInterval(poll);
            }, 3000);
          }
        },

        async loadProspect() {
          const r = await fetch(`/api/prospects/${prospectId}`);
          if (!r.ok) { window.location = '/'; return; }
          const data = await r.json();
          this.prospect = data;
          this.signals = data.signals || [];
          document.title = `${data.company_name} — Zetaris Prospector`;
        },

        async enrich() {
          await fetch(`/api/prospects/${prospectId}/enrich`, { method:'POST', headers:{'Content-Type':'application/json'}, body:'{"force":true}' });
          this.showToast('Re-enrichment started...');
          setTimeout(() => this.loadProspect(), 2000);
        },

        async synthesize() {
          await fetch(`/api/prospects/${prospectId}/synthesize`, { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
          this.showToast('AI synthesis started — check back in 15 seconds');
          setTimeout(() => this.loadProspect(), 15000);
        },

        async generateOutreach() {
          this.generatingOutreach = true;
          try {
            const r = await fetch(`/api/prospects/${prospectId}/outreach`, {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify(this.outreachForm),
            });
            if (r.ok) {
              this.latestOutreach = await r.json();
              this.showToast('Outreach variants generated');
            } else {
              const err = await r.json();
              this.showToast(`Error: ${err.detail}`);
            }
          } finally {
            this.generatingOutreach = false;
          }
        },

        async deleteSignal(signalId) {
          if (!confirm('Remove this signal? This will recalculate the score.')) return;
          await fetch(`/api/prospects/${prospectId}/signals/${signalId}`, { method:'DELETE' });
          await this.loadProspect();
          this.showToast('Signal removed');
        },

        copyToClipboard(text) {
          navigator.clipboard.writeText(text).then(() => this.showToast('Copied to clipboard'));
        },

        showToast(msg) {
          this.toast = msg;
          setTimeout(() => this.toast = '', 3500);
        },

        renderMarkdown(md) {
          if (!md) return '';
          return md
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^### (.+)$/gm, '<h3 style="font-weight:600;font-size:.9rem;margin:.75rem 0 .25rem;color:#374151">$1</h3>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/^- (.+)$/gm, '<li>$1</li>')
            .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/^(?!<[h|u|l|p])/gm, '<p>$&</p>');
        },
      };
    }
  </script>
</body>
</html>
